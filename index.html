<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>网页版桌球 🎱</title>
  <style>
    /* ========== CSS：负责页面长什么样 ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #14142b, #1d2d50);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #eee;
      padding: 16px;
      gap: 12px;
      overscroll-behavior: none;   /* 游戏操作时防止手机下拉刷新/回弹 */
    }
    h1 { font-size: 26px; letter-spacing: 3px; }
    #toolbar {
      display: flex; align-items: center; gap: 18px;
      font-size: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    #toolbar b { color: #ffd76e; }
    #status { color: #8fd0ff; font-weight: bold; }
    /* 力量条：外壳 + 内部填充 */
    #powerBarWrap {
      width: 170px; height: 14px;
      background: #333;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid #555;
    }
    #powerBar {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #4ade80, #facc15, #f87171);
      border-radius: 7px;
    }
    button {
      background: #ffd76e; color: #222;
      border: none; border-radius: 6px;
      padding: 7px 16px; font-size: 14px;
      cursor: pointer; font-weight: bold;
    }
    button:hover { background: #ffe08a; }
    canvas {
      max-width: 100%;
      height: auto;
      touch-action: none;   /* 手机上的触摸交给游戏处理，页面不跟着滚动 */
      user-select: none;
      -webkit-user-select: none;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
      cursor: crosshair;
    }
    .hint { font-size: 13px; color: #9fb0c9; }
  </style>
</head>
<body>
  <!-- HTML：负责页面有什么 -->
  <h1>🎱 网页版桌球（中式八球规则）</h1>

  <div id="toolbar">
    <span>已进球：<b id="sunk">0</b> / 15</span>
    <span>击球次数：<b id="shots">0</b></span>
    <span id="status">开球阶段</span>
    <div id="powerBarWrap"><div id="powerBar"></div></div>
    <button id="restart">重新开始</button>
  </div>

  <!-- 游戏发生的舞台：一块 1000x500 的画布 -->
  <canvas id="table" width="1000" height="500"></canvas>
  <p class="hint" id="hint">开球：把白球拖到开球区（虚线左侧），点击确认</p>

  <script>
    // ================= 1. 球桌基本参数 =================
    const canvas = document.getElementById('table');
    const ctx = canvas.getContext('2d');   // ctx 就是画笔，所有绘制都靠它
    const W = canvas.width, H = canvas.height;

    const RAIL = 45;              // 木头库边的宽度
    const LEFT = RAIL, RIGHT = W - RAIL, TOP = RAIL, BOTTOM = H - RAIL;
    const HEAD_X = LEFT + (RIGHT - LEFT) / 4;   // 开球线位置（桌长 1/4 处）
    const BALL_R = 12;            // 球的半径
    const FRICTION = 0.983;       // 摩擦系数：每帧速度保留的比例（越接近 1 摩擦越小、滚得越远）
    const STOP = 0.08;            // 速度低于这个值就当作停下
    const CUSHION_B = 0.85;       // 撞库边的弹性
    const BALL_B = 0.96;          // 球与球碰撞的弹性
    const MAX_POWER = 16;         // 满力时的初速度
    const DEAD = 30;              // 离白球 30 像素以内 = 零力量（防止误触）
    const RANGE = 200;            // 再拉远 200 像素 = 满力

    // 6 个球袋的位置（四角 + 两条长边中间）
    const POCKET_R = 26;
    const pockets = [
      { x: LEFT - 2,  y: TOP - 2 },
      { x: RIGHT + 2, y: TOP - 2 },
      { x: LEFT - 2,  y: BOTTOM + 2 },
      { x: RIGHT + 2, y: BOTTOM + 2 },
      { x: W / 2,     y: TOP - 6 },
      { x: W / 2,     y: BOTTOM + 6 },
    ];

    // ================= 2. 球的数据与规则状态 =================
    // 1-7 全色球的标准颜色；9-15 花色球用相同颜色（画成白底彩带）
    const SOLID_COLORS = { 1: '#f6c21a', 2: '#2e63d9', 3: '#e03a3a', 4: '#7b3fd1',
                           5: '#f08c1a', 6: '#1e9e4a', 7: '#8a2f1e' };

    let balls = [];          // 场上所有球（含白球）
    let cue = null;          // 白球的引用
    let eight = null;        // 黑8的引用
    let shots = 0;           // 击球次数
    let sunkCount = 0;       // 已进袋的目标球数
    let playerGroup = null;  // 你的花色：null=未定 / 'solid'全色 / 'stripe'花色
    let gameState = 'place'; // 'place'=摆放白球 / 'play'=正常击球 / 'won' / 'lost'
    let placeZone = 'kitchen'; // 摆放阶段允许的区域：'kitchen'开球区 / 'anywhere'自由球
    let cueOverlap = false;  // 摆放时白球是否压住了别的球
    let pendingBreak = true; // 下一杆是不是开球
    let currentShotIsBreak = false;  // 正在滚动的这一杆是不是开球
    let shootingEight = false;       // 正在滚动的这一杆是不是"打黑8阶段"
    let lossReason = '';     // 判负原因
    let eightRespawnPending = false;   // 黑8（开球进袋）等待重摆
    let cueBallInHandPending = false;  // 白球进袋后等待自由球摆放

    // 每个球就是一个"对象"：坐标 + 速度 + 颜色 + 状态
    function makeBall(x, y, num) {
      let group, color;
      if (num === 0)      { group = 'cue';    color = '#f8f6ee'; }
      else if (num === 8) { group = 'eight';  color = '#141414'; }
      else if (num <= 7)  { group = 'solid';  color = SOLID_COLORS[num]; }
      else                { group = 'stripe'; color = SOLID_COLORS[num - 8]; }
      return { x, y, vx: 0, vy: 0, r: BALL_R, color, num, group, active: true };
    }

    // 摆球：15 颗球摆成三角形（中式八球摆位）
    // 黑8在第三排中间；最后排两角必须一颗全色一颗花色
    function rack() {
      balls = [];
      const headX = LEFT + (RIGHT - LEFT) * 0.28, midY = (TOP + BOTTOM) / 2;
      cue = makeBall(headX, midY, 0);
      balls.push(cue);
      const footX = LEFT + (RIGHT - LEFT) * 0.72;
      const gap = BALL_R * 2 + 0.5;
      const order = [ [1], [9, 2], [10, 8, 3], [11, 4, 12, 13], [14, 5, 6, 15, 7] ];
      for (let i = 0; i < order.length; i++) {
        for (let j = 0; j < order[i].length; j++) {
          const x = footX + i * gap * 0.866;   // cos30° 让球错位排开
          const y = midY + (j - (order[i].length - 1) / 2) * gap;
          const b = makeBall(x, y, order[i][j]);
          balls.push(b);
        }
      }
      eight = balls.find(b => b.num === 8);
    }

    function myRemaining() {   // 本组还没进袋的球数
      if (!playerGroup) return 0;
      return balls.filter(b => b.active && b.group === playerGroup).length;
    }

    function setGroup(g) {
      playerGroup = g;
      playSound('group', 1);
    }

    function lose(reason) {
      gameState = 'lost';
      lossReason = reason;
      playSound('lose', 1);
    }

    function winGame() {
      gameState = 'won';
      playSound('win', 1);
    }

    // 进入"摆放白球"阶段
    function enterPlace(zone) {
      gameState = 'place';
      placeZone = zone;
      cue.active = false;
      cue.vx = cue.vy = 0;
      if (zone === 'kitchen') { cue.x = (LEFT + HEAD_X) / 2; cue.y = (TOP + BOTTOM) / 2; }
      setHint(zone === 'kitchen' ? '开球：把白球拖到开球区（虚线左侧），点击确认'
                                 : '自由球：点击球台任意位置放置白球（不要压到球）');
    }

    // 摆放中：白球跟随指针，限制在允许区域内
    function moveCueForPlacement() {
      const minX = LEFT + BALL_R, maxX = (placeZone === 'kitchen' ? HEAD_X - BALL_R : RIGHT - BALL_R);
      cue.x = Math.max(minX, Math.min(maxX, mouse.x));
      cue.y = Math.max(TOP + BALL_R, Math.min(BOTTOM - BALL_R, mouse.y));
      cueOverlap = balls.some(b => b !== cue && b.active &&
        Math.hypot(b.x - cue.x, b.y - cue.y) < b.r + cue.r + 1);
    }

    // 黑8放回置球点（开球进黑8时）
    function respawnEight() {
      const footX = LEFT + (RIGHT - LEFT) * 0.72, midY = (TOP + BOTTOM) / 2;
      eight.x = footX;
      eight.y = midY;
      eight.vx = eight.vy = 0;
      for (const b of balls) {
        if (b !== eight && b.active && Math.hypot(b.x - eight.x, b.y - eight.y) < b.r + eight.r + 1) {
          eight.y -= b.r + eight.r + 2;
        }
      }
      eight.active = true;
    }

    function setHint(t) { document.getElementById('hint').textContent = t; }

    // 状态栏文字（每帧刷新，代价很小）
    function updateStatus() {
      const el = document.getElementById('status');
      if (gameState === 'lost' || gameState === 'won') return;
      if (gameState === 'place') { el.textContent = placeZone === 'kitchen' ? '开球阶段' : '自由球'; return; }
      if (playerGroup === null) { el.textContent = '台面开放'; return; }
      const left = myRemaining();
      if (left === 0) el.textContent = '只剩黑8！';
      else el.textContent = '你的花色：' + (playerGroup === 'solid' ? '全色' : '花色') + '，剩 ' + left + ' 颗';
    }

    // ================= 3. 物理更新 =================
    let moving = false;   // 记录上一帧是否有球在动

    function update() {
      moving = false;
      for (const b of balls) {
        if (!b.active) continue;
        // 按速度移动
        b.x += b.vx;
        b.y += b.vy;
        // 摩擦减速
        let sp = Math.hypot(b.vx, b.vy);
        if (sp > 0) {
          b.vx *= FRICTION;
          b.vy *= FRICTION;
          sp *= FRICTION;
          if (sp < STOP) { b.vx = 0; b.vy = 0; }
          else moving = true;
        }
        // 撞到四条库边就反弹
        if (b.x - b.r < LEFT)   { b.x = LEFT + b.r;   b.vx =  Math.abs(b.vx) * CUSHION_B; playSound('cushion', sp / 20); }
        if (b.x + b.r > RIGHT)  { b.x = RIGHT - b.r;  b.vx = -Math.abs(b.vx) * CUSHION_B; playSound('cushion', sp / 20); }
        if (b.y - b.r < TOP)    { b.y = TOP + b.r;    b.vy =  Math.abs(b.vy) * CUSHION_B; playSound('cushion', sp / 20); }
        if (b.y + b.r > BOTTOM) { b.y = BOTTOM - b.r; b.vy = -Math.abs(b.vy) * CUSHION_B; playSound('cushion', sp / 20); }
      }
      // 球与球两两碰撞
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          collide(balls[i], balls[j]);
        }
      }
      // 球袋检测 + 中式八球规则判定
      for (const b of balls) {
        if (!b.active) continue;
        for (const p of pockets) {
          if (Math.hypot(b.x - p.x, b.y - p.y) < POCKET_R) {
            b.active = false;
            b.vx = b.vy = 0;
            playSound('pocket', 1);
            onBallPocketed(b);
            break;
          }
        }
      }
      updateStatus();
    }

    // 规则引擎：一颗球进袋后发生什么（白球在数组最前，会先于黑8判定）
    function onBallPocketed(b) {
      if (b === cue) {
        if (shootingEight) lose('击打黑8时白球进袋，判负');
        else cueBallInHandPending = true;   // 等球停稳后给自由球
      } else if (b.num === 8) {
        if (currentShotIsBreak) eightRespawnPending = true;   // 开球进黑8：取出重摆
        else if (!cue.active) lose('黑8与白球同进，判负');
        else if (shootingEight) winGame();
        else lose('本组球未清完就进了黑8，判负');
        if (!currentShotIsBreak) { sunkCount++; document.getElementById('sunk').textContent = sunkCount; }
      } else {
        // 开球进球不算定色（台面保持开放）；开球后第一次进球的花色 = 你的花色
        if (!currentShotIsBreak && playerGroup === null) setGroup(b.group);
        sunkCount++;
        document.getElementById('sunk').textContent = sunkCount;
      }
    }

    // 两个球之间的弹性碰撞（质量相同）
    function collide(a, b) {
      if (!a.active || !b.active) return;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      if (dist === 0 || dist >= a.r + b.r) return;   // 没碰到
      const nx = dx / dist, ny = dy / dist;          // 碰撞法线（接触方向）
      const dvn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny; // 沿法线的相对速度
      if (dvn <= 0) return;                          // 正在分离，不管
      a.vx -= dvn * nx * BALL_B;  a.vy -= dvn * ny * BALL_B;
      b.vx += dvn * nx * BALL_B;  b.vy += dvn * ny * BALL_B;
      playSound('hit', dvn / 15);   // 撞击音，力度越大越响
      // 把重叠的两个球各推开一半，防止粘在一起
      const overlap = (a.r + b.r - dist) / 2;
      a.x -= nx * overlap;  a.y -= ny * overlap;
      b.x += nx * overlap;  b.y += ny * overlap;
    }

    // ================= 4. 玩家操作 =================
    const mouse = { x: 0, y: 0 };
    let charging = false;   // 是否正在蓄力（按住中）
    let aimAng = 0;         // 当前瞄准角度（指针在杆尾，瞄准 = 指针的反方向）
    let power = 0;          // 当前力量 0~1

    // 把屏幕坐标换算成画布坐标（页面缩放时也能对准）
    function setPointer(cx, cy) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (cx - rect.left) * (W / rect.width);
      mouse.y = (cy - rect.top) * (H / rect.height);
    }

    // 按下：摆放阶段=确认位置；击球阶段=开始蓄力
    function press(cx, cy) {
      setPointer(cx, cy);
      ensureAudio();                   // 浏览器要求：用户点过之后才能播放声音
      if (gameState === 'place') {
        if (!cueOverlap) {             // 没压到别的球才能确认
          cue.active = true;
          gameState = 'play';
          setHint('指针=球杆尾端：杆从指针穿过白球指向目标 · 把指针拉离白球=蓄力 · 松开击球');
          updateStatus();
        }
        return;
      }
      if (gameState !== 'play' || moving) return;
      charging = true;
      updateAimAndPower();      // 按下瞬间就按指针位置计算方向和力量
    }

    // 指针 = 球杆尾端（8 Ball Pool 同款操作）：
    // 瞄准方向 = 从指针穿过白球指向对面；力量 = 指针离白球的距离（拉杆越远力量越大）。
    // 绕白球转圈 = 转向（力量不变），径向拉远 = 蓄力，方向和力量互不干扰。
    function updateAimAndPower() {
      const dx = cue.x - mouse.x, dy = cue.y - mouse.y;
      const dist = Math.hypot(dx, dy);
      aimAng = Math.atan2(dy, dx);       // 杆尾→球 的方向
      if (!charging) return;
      power = Math.max(0, Math.min(1, (dist - DEAD) / RANGE));
      powerBar.style.width = (power * 100).toFixed(1) + '%';
    }

    function drag(cx, cy) {
      setPointer(cx, cy);
      if (gameState === 'place') { moveCueForPlacement(); return; }
      updateAimAndPower();
    }

    // 松开：击球
    function release() {
      if (!charging) return;
      charging = false;
      powerBar.style.width = '0%';
      if (power < 0.03 || gameState !== 'play' || moving || !cue.active) return;
      // 出杆前锁定这一杆的属性：是不是开球？是不是打黑8阶段？
      currentShotIsBreak = pendingBreak;
      pendingBreak = false;
      shootingEight = playerGroup !== null && myRemaining() === 0 && eight.active;
      cue.vx = Math.cos(aimAng) * power * MAX_POWER;
      cue.vy = Math.sin(aimAng) * power * MAX_POWER;
      shots++;
      document.getElementById('shots').textContent = shots;
      playSound('shoot', power);
    }

    // 鼠标事件：mousemove 挂在 window 上，拖出球桌也能继续蓄力
    window.addEventListener('mousemove', e => drag(e.clientX, e.clientY));
    canvas.addEventListener('mousedown', e => press(e.clientX, e.clientY));
    window.addEventListener('mouseup', release);
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // 触屏事件：挂在 window 上，整页都能操作（手指划出球桌也能继续蓄力）。
    // activeTouchId 只跟踪"正在操作的那根手指"，多指互不干扰；
    // 手指不在画布上时不接管，页面正常滚动。
    let activeTouchId = null;

    function isTouchOnCanvas(t) {
      const rect = canvas.getBoundingClientRect();
      return t.clientX >= rect.left && t.clientX <= rect.right &&
             t.clientY >= rect.top && t.clientY <= rect.bottom;
    }

    window.addEventListener('touchstart', e => {
      if (activeTouchId !== null) return;        // 已有一根手指在操作
      const t = e.changedTouches[0];
      if (!isTouchOnCanvas(t)) return;           // 画布外的触摸不接管
      e.preventDefault();
      activeTouchId = t.identifier;
      press(t.clientX, t.clientY);
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      const t = e.changedTouches[0];
      if (activeTouchId === null || t.identifier !== activeTouchId) return;
      e.preventDefault();
      drag(t.clientX, t.clientY);
    }, { passive: false });

    window.addEventListener('touchend', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === activeTouchId) {
          activeTouchId = null;
          e.preventDefault();
          release();
        }
      }
    }, { passive: false });

    // 系统打断手势（来电、下拉通知等）：安全取消本次操作
    window.addEventListener('touchcancel', e => {
      for (const t of e.changedTouches) {
        if (t.identifier === activeTouchId) {
          activeTouchId = null;
          charging = false;
          power = 0;
          powerBar.style.width = '0%';
        }
      }
    }, { passive: false });

    document.getElementById('restart').addEventListener('click', () => {
      rack();
      shots = 0;
      sunkCount = 0;
      playerGroup = null;
      pendingBreak = true;
      currentShotIsBreak = false;
      shootingEight = false;
      lossReason = '';
      eightRespawnPending = false;
      cueBallInHandPending = false;
      charging = false;
      power = 0;
      cueOverlap = false;
      document.getElementById('sunk').textContent = 0;
      document.getElementById('shots').textContent = 0;
      document.getElementById('status').textContent = '开球阶段';
      powerBar.style.width = '0%';
      enterPlace('kitchen');
    });

    // ================= 4.5 音效（Web Audio 现场合成，不需要音频文件） =================
    let audioCtx = null;
    let lastSnd = 0;

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // 基础发音函数：频率 + 时长 + 音量 + 波形
    function blip(freq, dur, vol, type) {
      if (!audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    }

    // 撞库边的"咚"：正弦波频率从 160Hz 快速滑到 55Hz，短促衰减
    // （正弦波音色柔和；频率下滑模拟撞击后能量衰减的闷响）
    function thud(vol) {
      if (!audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(160, audioCtx.currentTime);
      o.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.09);
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
      o.connect(g).connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.13);
    }

    function playSound(kind, strength) {
      if (!audioCtx) return;
      strength = Math.max(0.05, Math.min(1, strength));
      if (kind === 'hit') {                 // 球碰球：清脆短音
        const now = performance.now();
        if (now - lastSnd < 40) return;     // 一杆炸开时别响成一团
        lastSnd = now;
        blip(1800 + strength * 800, 0.06, strength * 0.22, 'triangle');
      } else if (kind === 'cushion') {      // 撞库边：低频"咚"（闷响）
        const now = performance.now();
        if (now - lastSnd < 40) return;
        lastSnd = now;
        thud(strength * 0.4);
      } else if (kind === 'pocket') {       // 进球：两声下滑音
        blip(500, 0.25, 0.3, 'sine');
        setTimeout(() => blip(300, 0.3, 0.25, 'sine'), 60);
      } else if (kind === 'shoot') {        // 出杆
        blip(900, 0.05, strength * 0.2, 'square');
      } else if (kind === 'group') {        // 定色提示音
        blip(700, 0.12, 0.3, 'sine');
        setTimeout(() => blip(1000, 0.15, 0.3, 'sine'), 100);
      } else if (kind === 'win') {          // 胜利小琶音
        [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, 0.3, 0.3, 'sine'), i * 140));
      } else if (kind === 'lose') {         // 判负低音
        blip(220, 0.5, 0.35, 'sawtooth');
        setTimeout(() => blip(150, 0.6, 0.35, 'sawtooth'), 250);
      }
    }

    // ================= 5. 绘制渲染 =================
    function draw() {
      drawFrame();
      drawFelt();
      drawKitchenLine();
      drawPockets();
      drawPlaceZone();
      drawAim();
      for (const b of balls) if (b.active) drawBall(b);
      drawGhostCue();
      drawCue();
      drawOverlay();
    }

    function drawFrame() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#8a5a2b');
      g.addColorStop(0.5, '#6b431d');
      g.addColorStop(1, '#8a5a2b');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(255, 220, 150, 0.35)';
      ctx.lineWidth = 2;
      ctx.strokeRect(LEFT - 6, TOP - 6, RIGHT - LEFT + 12, BOTTOM - TOP + 12);
    }

    function drawFelt() {
      const g = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 560);
      g.addColorStop(0, '#2f8f52');
      g.addColorStop(1, '#14502f');
      ctx.fillStyle = g;
      ctx.fillRect(LEFT, TOP, RIGHT - LEFT, BOTTOM - TOP);
      // 细条纹增加质感
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.lineWidth = 1;
      for (let y = TOP + 20; y < BOTTOM; y += 20) {
        ctx.beginPath(); ctx.moveTo(LEFT, y); ctx.lineTo(RIGHT, y); ctx.stroke();
      }
    }

    function drawKitchenLine() {
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.setLineDash([4, 6]);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(HEAD_X, TOP); ctx.lineTo(HEAD_X, BOTTOM); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.font = '13px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('开 球 区', (LEFT + HEAD_X) / 2, TOP - 26);
    }

    function drawPockets() {
      for (const p of pockets) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, POCKET_R, 0, Math.PI * 2);
        ctx.fillStyle = '#0b0b0b';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // 摆放白球时高亮允许区域
    function drawPlaceZone() {
      if (gameState !== 'place') return;
      ctx.fillStyle = 'rgba(120, 255, 160, 0.08)';
      if (placeZone === 'kitchen') ctx.fillRect(LEFT, TOP, HEAD_X - LEFT, BOTTOM - TOP);
      else ctx.fillRect(LEFT, TOP, RIGHT - LEFT, BOTTOM - TOP);
    }

    function drawAim() {
      if (gameState !== 'play' || !cue.active || moving) return;
      const ang = aimAng;   // aimAng 随时由指针位置维护（杆尾→球）
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.setLineDash([6, 9]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cue.x, cue.y);
      ctx.lineTo(cue.x + Math.cos(ang) * 170, cue.y + Math.sin(ang) * 170);
      ctx.stroke();
      ctx.restore();
    }

    function drawBall(b) {
      // 投影
      ctx.beginPath();
      ctx.ellipse(b.x + 3, b.y + 4, b.r, b.r * 0.8, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fill();
      // 球体：花色球 = 白底 + 中间彩带
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.group === 'stripe' ? '#f8f6ee' : b.color;
      ctx.fill();
      if (b.group === 'stripe') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.clip();                                    // 彩带裁剪在圆形里
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - b.r, b.y - b.r * 0.45, b.r * 2, b.r * 0.9);
        ctx.restore();
      }
      // 高光（让球有立体感）
      const hl = ctx.createRadialGradient(
        b.x - b.r * 0.4, b.y - b.r * 0.45, 0,
        b.x - b.r * 0.4, b.y - b.r * 0.45, b.r * 1.6);
      hl.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
      hl.addColorStop(0.35, 'rgba(255, 255, 255, 0)');
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = hl;
      ctx.fill();
      // 描边
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // 号码
      if (b.num > 0) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r * 0.55, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.fill();
        ctx.fillStyle = '#222';
        ctx.font = 'bold 11px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.num, b.x, b.y + 0.5);
      }
    }

    // 摆放阶段：白球半透明跟随指针，压住别的球时变红提示
    function drawGhostCue() {
      if (gameState !== 'place') return;
      ctx.globalAlpha = 0.65;
      ctx.beginPath();
      ctx.arc(cue.x, cue.y, cue.r, 0, Math.PI * 2);
      ctx.fillStyle = '#f8f6ee';
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(cue.x, cue.y, cue.r + 2, 0, Math.PI * 2);
      ctx.strokeStyle = cueOverlap ? 'rgba(255, 80, 80, 0.95)' : 'rgba(255, 255, 255, 0.7)';
      ctx.lineWidth = 2.5;
      ctx.setLineDash(cueOverlap ? [5, 4] : []);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawCue() {
      if (gameState !== 'play' || !cue.active || moving) return;
      // 球杆固定长度；蓄力 = 整根杆沿轴线向后平移（杆头离开球面），不是变长
      const ang = aimAng;
      const LEN = 180;                             // 杆身固定长度
      const pull = charging ? 6 + power * 60 : 6;  // 蓄力时杆向后拉，最大 60px
      const butt = cue.r + 4 + pull + LEN;         // 杆尾离球心的距离
      ctx.save();
      ctx.translate(cue.x - Math.cos(ang) * butt, cue.y - Math.sin(ang) * butt);
      ctx.rotate(ang);
      // rotate 之后 +x 指向球。杆身从 0（杆尾）到 LEN（前端），整杆向后平移
      const g = ctx.createLinearGradient(0, 0, LEN, 0);
      g.addColorStop(0, '#5a3415');
      g.addColorStop(1, '#e8c48a');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.roundRect(0, -3.5, LEN, 7, 3);
      ctx.fill();
      ctx.fillStyle = '#3d6fb4';        // 蓝色皮头（贴球一端）
      ctx.beginPath();
      ctx.roundRect(LEN - 7, -3.6, 8, 7.2, 2);
      ctx.fill();
      ctx.restore();
    }

    // 胜负结算画面
    function drawOverlay() {
      if (gameState !== 'won' && gameState !== 'lost') return;
      const win = gameState === 'won';
      const cx = (LEFT + RIGHT) / 2, cy = (TOP + BOTTOM) / 2;
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(LEFT, TOP, RIGHT - LEFT, BOTTOM - TOP);
      ctx.textAlign = 'center';
      ctx.fillStyle = win ? '#7dffa8' : '#ff8f8f';
      ctx.font = 'bold 44px "Microsoft YaHei", sans-serif';
      ctx.fillText(win ? '🎉 恭喜获胜！' : '❌ 判负', cx, cy - 24);
      ctx.fillStyle = '#fff';
      ctx.font = '19px "Microsoft YaHei", sans-serif';
      ctx.fillText(win ? ('共 ' + shots + ' 杆完成') : lossReason, cx, cy + 22);
      ctx.fillStyle = '#ccc';
      ctx.font = '15px "Microsoft YaHei", sans-serif';
      ctx.fillText('点右上角"重新开始"再来一局', cx, cy + 56);
    }

    // ================= 6. 游戏主循环 =================
    const powerBar = document.getElementById('powerBar');

    function loop() {
      // 等所有球停稳后，再处理"黑8重摆"和"自由球摆放"
      if (!moving && (gameState === 'play' || gameState === 'place')) {
        if (eightRespawnPending) { respawnEight(); eightRespawnPending = false; setHint('开球进黑8：已取出重摆，台面继续开放'); }
        if (cueBallInHandPending) { cueBallInHandPending = false; enterPlace('anywhere'); }
      }
      update();
      draw();
      requestAnimationFrame(loop);   // 下一帧继续，形成 60 帧/秒的循环
    }

    rack();
    mouse.x = cue.x - 200;   // 初始指针在白球左侧 → 瞄准方向水平向右（指向球堆）
    mouse.y = cue.y;
    enterPlace('kitchen');
    loop();
  </script>
</body>
